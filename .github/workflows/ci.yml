# SPDX-License-Identifier: BSD-3-Clause
name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: sodium, curl
          coverage: none
      - run: composer install --no-interaction --no-progress
      - run: composer lint
      - run: composer test

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck install/install.sh dev/test-env.sh dev/regression.sh dev/integration.sh

  # Real users, MariaDB, WP-CLI and WordPress, without ISPConfig: the commands of lib/ run as they do on a node.
  integration:
    runs-on: ubuntu-24.04
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=24
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: sodium, curl, mysqli
          coverage: none
      - run: composer install --no-interaction --no-progress
      - name: WP-CLI
        run: |
          curl -sSfL -o /tmp/wp https://github.com/wp-cli/wp-cli/releases/download/v2.12.0/wp-cli-2.12.0.phar
          sudo install -m 0755 /tmp/wp /usr/local/bin/wp
          wp --version
      # The runner ships the MySQL 8.0 client, whose mysqldump fails against MariaDB (COLUMN_STATISTICS):
      # nodes have the client of their own server.
      - name: MariaDB client
        run: |
          sudo DEBIAN_FRONTEND=noninteractive apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq mariadb-client
          mysqldump --version
      - name: Users, folders, databases and WordPress
        run: sudo -E bash dev/integration.sh setup
        env:
          MYSQL_HOST: 127.0.0.1
          MYSQL_PWD: root
          WPSTATION_IT_DB_HOST: 127.0.0.1
      - name: Integration tests, as root
        run: sudo bash -c 'set -a; . /etc/wpstation-it.env; set +a; php vendor/bin/phpunit --testsuite integration --log-junit /tmp/integration.xml'
      # Annotations can be read without logging in to GitHub, the log of a job cannot.
      - name: Failed tests as annotations
        if: failure()
        run: |
          sudo cat /tmp/integration.xml | python3 -c '
          import sys, xml.etree.ElementTree as ET
          for case in ET.parse(sys.stdin).iter("testcase"):
              for problem in list(case.findall("failure")) + list(case.findall("error")):
                  text = (problem.text or problem.get("message") or "")[:3000]
                  text = text.replace("%", "%25").replace("\r", "").replace("\n", "%0A")
                  print("::error title=" + case.get("class", "") + "::" + case.get("name", "") + "%0A" + text)
          '
