<div class='page-header'>
    <h1><tmpl_if name="staging">{tmpl_var name='staging_head_txt'}<tmpl_else>{tmpl_var name='clone_head_txt'}</tmpl_if> {tmpl_var name='source_domain'}</h1>
</div>
<tmpl_if name="staging">
<p class="fieldDescription" id="staging_desc">{tmpl_var name='staging_desc_txt'}</p>
<tmpl_else>
<p class="fieldDescription">{tmpl_var name='clone_desc_txt'}</p>
</tmpl_if>

<tmpl_if name="error_msg"><div class="alert alert-danger" id="clone_error">{tmpl_var name='error_msg'}</div></tmpl_if>

<div class="panel" style="padding:20px;">
    <div class="form-group">
        <label for="domain" class="col-sm-3 control-label">{tmpl_var name='domain_txt'}</label>
        <div class="col-sm-9"><input type="text" name="domain" id="domain" value="{tmpl_var name='domain'}" class="form-control" /></div>
    </div>
    <tmpl_unless name="staging">
    <div class="form-group">
        <label for="client_id" class="col-sm-3 control-label">{tmpl_var name='client_txt'}</label>
        <div class="col-sm-9"><select name="client_id" id="client_id" class="form-control">{tmpl_var name='client_options'}</select></div>
    </div>
    <div class="form-group">
        <label for="access_type" class="col-sm-3 control-label">{tmpl_var name='access_type_txt'}</label>
        <div class="col-sm-9"><select name="access_type" id="access_type" class="form-control"><option value="sftp">SFTP</option><option value="ftp">FTP</option></select></div>
    </div>

    <div class="form-group">
        <div class="col-sm-offset-3 col-sm-9">
            <label><input type="checkbox" name="confirm_client" id="confirm_client" value="1" /> {tmpl_var name='confirm_client_txt'}</label>
        </div>
    </div>
    </tmpl_unless>

    <input type="hidden" name="id" value="{tmpl_var name='id'}" />
    <tmpl_if name="staging"><input type="hidden" name="staging" value="1" /></tmpl_if>
    <input type="hidden" name="_csrf_id" value="{tmpl_var name='_csrf_id'}" />
    <input type="hidden" name="_csrf_key" value="{tmpl_var name='_csrf_key'}" />

    <div class="clear">
        <div class="right">
            <button class="btn btn-default formbutton-success" type="button" data-submit-form="pageForm" data-form-action="wpmanager/wpm_site_clone.php"><tmpl_if name="staging">{tmpl_var name='staging_btn_txt'}<tmpl_else>{tmpl_var name='clone_btn_txt'}</tmpl_if></button>
            <button class="btn btn-default formbutton-default" type="button" data-load-content="wpmanager/wpm_site_view.php?id={tmpl_var name='id'}">{tmpl_var name='cancel_txt'}</button>
        </div>
    </div>
</div>
