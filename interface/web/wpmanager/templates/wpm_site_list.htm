<div class='page-header'>
    <h1><tmpl_var name="list_head_txt"></h1>
</div>
<p class="fieldDescription">{tmpl_var name='list_desc_txt'}</p>

<button class="btn btn-default formbutton-success" type="button" data-load-content="wpmanager/wpm_site_edit.php">{tmpl_var name='add_new_record_txt'}</button>

<div class="table-wrapper marginTop15">
<table class="table">
    <thead class="dark form-group-sm">
        <tr>
            <th data-column="domain"><tmpl_var name="domain_txt"></th>
            <th data-column="status"><tmpl_var name="status_txt"></th>
            <th><tmpl_var name="status_message_txt"></th>
            <th><tmpl_var name="wp_version_txt"></th>
            <th><tmpl_var name="updates_txt"></th>
            <th class="small-col text-right">{tmpl_var name='search_limit'}</th>
        </tr>
        <tr>
            <td><input class="form-control" type="text" name="search_domain" value="{tmpl_var name='search_domain'}" /></td>
            <td><select class="form-control" name="search_status">{tmpl_var name='search_status'}</select></td>
            <td></td>
            <td></td>
            <td></td>
            <td class="text-right"><button type="button" class="btn btn-default formbutton-default formbutton-narrow" name="Filter" id="Filter" value="{tmpl_var name='filter_txt'}" data-submit-form="pageForm" data-form-action="wpmanager/wpm_site_list.php"><span class="icon icon-filter"></span></button></td>
        </tr>
    </thead>
    <tbody>
        <tmpl_loop name="records">
        <tr>
            <td><a href="#" data-load-content="wpmanager/wpm_site_view.php?id={tmpl_var name='id'}">{tmpl_var name="domain"}</a></td>
            <td>{tmpl_var name="status"}</td>
            <td>{tmpl_var name="status_summary"}</td>
            <td>{tmpl_var name="wp_version"}</td>
            <td>{tmpl_var name="updates"}</td>
            <td class="text-right">
                <a class="btn btn-default formbutton-danger formbutton-narrow" href="javascript: ISPConfig.confirm_action('wpmanager/wpm_site_del.php?id={tmpl_var name='id'}&_csrf_id={tmpl_var name='csrf_id'}&_csrf_key={tmpl_var name='csrf_key'}&phpsessid={tmpl_var name='phpsessid'}','{tmpl_var name='delete_confirmation'}');"><span class="icon icon-delete"></span></a>
            </td>
        </tr>
        </tmpl_loop>
        <tmpl_unless name="records">
        <tr class="tbl_row_noresults">
            <td colspan="6">{tmpl_var name='globalsearch_noresults_text_txt'}</td>
        </tr>
        </tmpl_unless>
    </tbody>
    <tfoot>
        <tr><td colspan="6"><tmpl_var name="paging"></td></tr>
    </tfoot>
</table>
</div>
